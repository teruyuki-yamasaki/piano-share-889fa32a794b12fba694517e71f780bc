<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Score Companion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A1E29'/%3E%3Crect x='6' y='8' width='4' height='16' rx='1' fill='%23F6F4EE'/%3E%3Crect x='11' y='8' width='4' height='16' rx='1' fill='%23F6F4EE'/%3E%3Crect x='16' y='8' width='4' height='16' rx='1' fill='%234A7DFF'/%3E%3Crect x='21' y='8' width='4' height='16' rx='1' fill='%23F6F4EE'/%3E%3Crect x='6' y='22' width='19' height='2' fill='%23B3263E'/%3E%3C/svg%3E" />
  <!-- スマートフォン・タブレット: ホーム画面に追加して使う（PWA）。Service Worker は js/app/mobile.js が登録する -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Score Companion" />
  <meta name="theme-color" content="#1A1E29" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-hidden="true">
        <span class="brand-mark"></span>
      </div>
      <div class="piece">
        <div class="piece-inner">
          <label class="piece-select">
            <span class="sr-only" data-i18n="choosePiece">曲を選ぶ</span>
            <!-- 選んだ曲名は自前で表示する（select はいちばん長い曲名の幅になるので、透明にして上に重ねる） -->
            <span class="piece-title" id="pieceTitle" aria-hidden="true"><span class="piece-title-text" id="pieceTitleText"></span></span>
            <select id="pieceSelect"></select>
          </label>
          <div class="piece-meta" id="pieceMeta"></div>
        </div>
      </div>
      <!-- 再生（前の曲・再生 / 一時停止・次の曲・リピート）と速さは曲名のすぐ右に -->
      <div class="transport">
        <button class="icon-btn" id="rewindBtn" data-i18n-aria-label="rewind" data-i18n-title="rewindTitle">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 5.5v13L9 12z"/></svg>
        </button>
        <button class="play" id="playBtn" data-i18n-aria-label="play">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="icon-btn" id="nextPieceBtn" disabled data-i18n-aria-label="nextPiece" data-i18n-title="nextPieceTitle">
          <svg viewBox="0 0 24 24"><rect x="16.6" y="5" width="2.4" height="14" rx="1"/><path d="M5 5.5v13L15 12z"/></svg>
        </button>
        <button class="icon-btn repeat-btn" id="repeatBtn" data-mode="off" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M7 7h9.2l-1.6-1.6L16 4l4 4-4 4-1.4-1.4L16.2 9H7a2 2 0 0 0-2 2v1.5H3V11a4 4 0 0 1 4-4zM17 17H7.8l1.6 1.6L8 20l-4-4 4-4 1.4 1.4L7.8 15H17a2 2 0 0 0 2-2v-1.5h2V13a4 4 0 0 1-4 4z"/></svg>
          <span class="repeat-one" aria-hidden="true">1</span>
        </button>
      </div>
      <!-- 速さはリピートボタンの隣に -->
      <label class="tempo">
        <span data-i18n="speed">速さ</span>
        <!-- 細かい調整は難しいので、0.5〜2.0 倍の段階から選ぶ（選択肢は main.ts が TEMPO_STEPS から作る） -->
        <select class="view-select" id="tempoSelect"></select>
      </label>
      <div class="top-actions">
        <!-- MIDI 機器。押すと機器と音の設定 -->
        <button class="device-pill" id="devicePill" data-i18n-title="midiSettings">
          <span class="dot" id="deviceDot"></span>
          <span id="deviceLabel">MIDI 機器を確認中…</span>
        </button>
        <!-- 音名・鍵盤の範囲は一度決めたらあまり変えない表示の設定なので、配色・言語と並べて上のバーに -->
        <div class="view-opts">
          <!-- 場所を取らないようドロップダウンに -->
          <select class="view-select" id="namesSeg" data-i18n-aria-label="noteNames" data-i18n-title="noteNames">
            <option value="solfege" data-i18n="solfege">ドレミ</option>
            <option value="letter" data-i18n="letters">C D E</option>
            <option value="none" data-i18n="namesOff">音名なし</option>
          </select>
          <select class="view-select" id="keysSeg" data-i18n-aria-label="keyRange" data-i18n-title="keyRange">
            <option value="fit" data-i18n="keysFit">曲の音域</option>
            <option value="full" data-i18n="keys88">88 鍵</option>
          </select>
        </div>
        <button class="btn ghost theme-btn" id="themeBtn" data-theme="auto" aria-label="配色: 自動">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
          <span class="auto-badge" aria-hidden="true">A</span>
        </button>
        <button class="btn ghost" id="languageBtn" data-i18n="languageToggle" aria-label="Language / 言語">English</button>
        <button class="btn ghost" id="helpBtn" aria-pressed="false" aria-controls="helpPanel" data-i18n-title="helpTitle">
          <span class="help-q" aria-hidden="true">?</span> <span data-i18n="help">使い方</span>
        </button>
      </div>
    </header>

    <nav class="toolbar" data-i18n-aria-label="practiceSettings">
      <!-- 誰が弾くか（弾く / 聴く、進め方、パートごとの「あなた / 自動」）。練習バーの最初に -->
      <div class="parts-bar">
        <div class="play-opts">
          <div class="seg" role="radiogroup" data-i18n-aria-label="playPart" id="roleSeg">
            <button role="radio" data-role="play" data-i18n="playMode" data-i18n-title="playModeTitle">弾く</button>
            <button role="radio" data-role="listen" data-i18n="listen">聴く</button>
          </div>
          <div class="seg small" role="radiogroup" data-i18n-aria-label="progress" id="styleSeg">
            <button role="radio" data-style="follow" data-i18n="follow" data-i18n-title="followTitle">待ってくれる</button>
            <button role="radio" data-style="tempo" data-i18n="tempoMode" data-i18n-title="tempoTitle">テンポどおり</button>
            <button role="radio" data-style="karaoke" data-i18n="karaoke" data-i18n-title="karaokeTitle">採点</button>
          </div>
        </div>
        <div class="parts" id="partChips" data-i18n-aria-label="parts"></div>
      </div>

      <!-- マイク: 入力の大きさの流れと聞き取った音を、決まった幅の中に出す（入力で幅が変わらない） -->
      <button class="mic-btn" id="micBtn" aria-pressed="false" data-i18n-title="micTitle">
        <!-- 切っているときは斜線つき（ミュート）、使っているときはふつうのマイク -->
        <svg class="i-mic-off" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 3.5 20 19.5" stroke="var(--chrome)" stroke-width="4" stroke-linecap="round"/><path d="M4 3.5 20 19.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <svg class="i-mic-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span data-i18n="mic">マイク</span>
        <canvas class="mic-wave" id="micWave" width="80" height="22" aria-hidden="true"></canvas>
        <span class="mic-note" id="micNoteLabel"></span>
      </button>

      <!-- メトロノーム・カウント・くり返しは練習バーの最後に -->
      <div class="toggles">
        <label class="chk"><input type="checkbox" id="metroChk" /> <span data-i18n="metronome">メトロノーム</span></label>
        <label class="chk"><input type="checkbox" id="countInChk" checked /> <span data-i18n="countIn">カウント</span></label>
        <label class="chk loop">
          <input type="checkbox" id="loopChk" /> <span data-i18n="loop">くり返し</span>
          <select id="loopFrom" data-i18n-aria-label="loopStart"></select>
          <span>〜</span>
          <select id="loopTo" data-i18n-aria-label="loopEnd"></select>
        </label>
      </div>
    </nav>

    <section class="desk" data-i18n-aria-label="score">
      <div class="score-scroll" id="scoreView"></div>
    </section>

    <!-- 楽譜とピアノロールの区切り（ドラッグで楽譜の欄の高さを変える） -->
    <div class="splitter" id="scoreSplitter" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-title="splitterTitle" data-i18n-aria-label="splitterLabel"></div>

    <section class="stage" data-i18n-aria-label="piano">
      <canvas id="roll" class="roll"></canvas>
      <canvas id="keys" class="keys"></canvas>
      <div class="banner" id="banner" hidden></div>
      <div class="judge-fx" id="judgeFx" aria-hidden="true"></div>
    </section>

    <footer class="statusbar">
      <span id="statusPos">小節 1 / 1</span>
      <span id="statusScore"></span>
      <span class="hint" id="statusHint" data-i18n="statusHint">電子ピアノか、パソコンのキー（A S D F … / Z X でオクターブ）で弾けます。スペースキーで再生・一時停止。</span>
    <a href="./credits.html">楽譜の出典・利用条件</a></footer>
  </div>

  <dialog id="settingsDlg" class="dialog">
    <form method="dialog">
      <h2 data-i18n="settingsTitle">MIDI 機器と音</h2>
      <label class="field">
        <span data-i18n="input">入力（弾く鍵盤）</span>
        <select id="inputSelect"></select>
      </label>
      <label class="field">
        <span data-i18n="soundDestination">伴奏の音を出す先</span>
        <select id="soundSelect">
          <option value="auto" data-i18n="soundAuto">自動（電子ピアノがあればピアノから）</option>
          <option value="piano" data-i18n="soundPiano">電子ピアノから鳴らす</option>
          <option value="synth" data-i18n="soundSynth">このパソコンから鳴らす</option>
          <option value="both" data-i18n="soundBoth">両方から鳴らす</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="output">MIDI 出力先</span>
        <select id="outputSelect"></select>
      </label>
      <label class="field check">
        <input type="checkbox" id="monitorChk" />
        <span data-i18n="monitor">自分の演奏もパソコンから鳴らす（音源のない MIDI キーボード向け）</span>
      </label>
      <label class="field">
        <span data-i18n="volume">伴奏の音量</span>
        <input type="range" id="accompVol" min="30" max="150" step="5" value="90" />
      </label>
      <label class="field">
        <span data-i18n="accompVoice">伴奏の音色</span>
        <select id="voiceSelect">
          <option value="mirror" data-i18n="voiceMirror">自分の演奏と同じ（電子ピアノで選んだ音色）</option>
          <option value="piano" data-i18n="voicePiano">ピアノ</option>
          <option value="epiano" data-i18n="voiceEpiano">エレクトリックピアノ</option>
          <option value="harpsichord" data-i18n="voiceHarpsichord">チェンバロ</option>
          <option value="organ" data-i18n="voiceOrgan">オルガン</option>
          <option value="strings" data-i18n="voiceStrings">ストリングス</option>
          <option value="choir" data-i18n="voiceChoir">コーラス</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="accompChannel">伴奏を送る MIDI チャンネル</span>
        <select id="channelSelect"></select>
      </label>
      <p class="note" data-i18n="voiceNote"></p>
      <label class="field check">
        <input type="checkbox" id="pedalChk" checked />
        <span data-i18n="scorePedal">楽譜のペダル記号どおりに、伴奏でペダルを使う</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="graceChk" checked />
        <span data-i18n="playGraces">前打音を鳴らす（伴奏・お手本。主音は少し遅れて始まる）</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="wedgeChk" checked />
        <span data-i18n="playWedges">松葉（クレッシェンド・ディミヌエンド）で伴奏・お手本の音の強さを変える（終わりに強弱記号があるときだけ）</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="sourceBreaksChk" checked />
        <span data-i18n="sourceBreaks">改行を元の楽譜に合わせる（画面に入らない段は、さらに分ける）</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="tremoloChk" checked />
        <span data-i18n="playTremolos">トレモロを鳴らす（伴奏・お手本。2 つの音を交互に・同じ音を細かく繰り返す）</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="glissChk" checked />
        <span data-i18n="playGlissandos">グリッサンドを鳴らす（伴奏・お手本。終わりの音が書かれていなければ次の音まで）</span>
      </label>
      <label class="field">
        <span data-i18n="glissMode">グリッサンドでなぞる鍵</span>
        <select id="glissModeSelect">
          <option value="auto" data-i18n="glissAuto">自動（黒鍵の和音なら黒鍵、ほかは白鍵）</option>
          <option value="white" data-i18n="glissWhite">白鍵</option>
          <option value="black" data-i18n="glissBlack">黒鍵</option>
          <option value="chromatic" data-i18n="glissChromatic">半音階</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="softBoost">弱音を聴きやすく（伴奏・お手本。強弱の差は残す）</span>
        <select id="softBoostSelect">
          <option value="off" data-i18n="softBoostOff">切</option>
          <option value="light" data-i18n="softBoostLight">弱</option>
          <option value="medium" data-i18n="softBoostMedium">中</option>
          <option value="strong" data-i18n="softBoostStrong">強</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="noteNames">音名の表示</span>
        <select id="namesSelect">
          <option value="solfege" data-i18n="solfege">ドレミ</option>
          <option value="letter" data-i18n="letters">C D E</option>
          <option value="none" data-i18n="hide">表示しない</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="rollSpeed">ノートの落ちる速さ</span>
        <input type="range" id="rollZoom" min="3" max="12" step="1" value="6" />
      </label>
      <label class="field">
        <span><span data-i18n="audioOffset">音と画面のずれの補正</span> <b id="audioOffsetValue"></b></span>
        <input type="range" id="audioOffset" min="0" max="400" step="10" value="0" />
      </label>
      <p class="note" data-i18n="audioOffsetNote"></p>
      <label class="field check">
        <input type="checkbox" id="fullKeysChk" />
        <span data-i18n="fullKeys">88 鍵すべてを表示</span>
      </label>
      <p class="note" id="midiNote"></p>

      <h3 data-i18n="micSection">マイク入力（歌・アコースティック楽器）</h3>
      <label class="field check">
        <input type="checkbox" id="micChk" />
        <span data-i18n="micEnable">マイクで演奏を聴き取る</span>
      </label>
      <label class="field">
        <span data-i18n="micDevice">使うマイク</span>
        <select id="micSelect"></select>
      </label>
      <label class="field">
        <span data-i18n="micSens">マイクの感度</span>
        <input type="range" id="micSens" min="0" max="100" step="5" value="55" />
      </label>
      <div class="field">
        <span data-i18n="micLevel">入力レベル</span>
        <div class="level-meter"><span id="micMeter"></span><b id="micMeterNote"></b></div>
      </div>
      <label class="field check">
        <input type="checkbox" id="octaveFreeChk" checked />
        <span data-i18n="octaveFree">オクターブ違いも正解にする（歌うとき向け）</span>
      </label>
      <p class="note" data-i18n="micNote"></p>
      <div class="dialog-actions">
        <button class="btn" value="close" data-i18n="close">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="resultDlg" class="dialog result">
    <form method="dialog">
      <h2 id="resultTitle" data-i18n="resultDefault">演奏おつかれさまでした</h2>
      <div class="result-grid" id="resultGrid"></div>
      <div class="result-extra" id="resultExtra"></div>
      <div class="dialog-actions">
        <button class="btn ghost" value="close" data-i18n="close">閉じる</button>
        <button class="btn" value="again" id="againBtn" data-i18n="again">もう一度</button>
      </div>
    </form>
  </dialog>

  <aside class="help-panel" id="helpPanel" hidden data-i18n-aria-label="helpPanel">
    <header class="help-head">
      <strong data-i18n="helpPanel">使い方ガイド</strong>
      <a class="btn ghost small" id="helpTabLink" href="./guide.html" target="_blank" rel="noopener" data-i18n="openInTab">新しいタブで開く</a>
      <button class="icon-btn" id="helpClose" data-i18n-aria-label="closePanel" data-i18n-title="closePanel">
        <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4L12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
    </header>
    <nav class="guide-toc compact" id="helpToc"></nav>
    <div class="guide-doc" id="helpBody"></div>
  </aside>

  <div class="drop-hint" id="dropHint"><span data-i18n="drop">ここに楽譜ファイルをドロップ</span><br /><small data-i18n="dropFormats">MIDI・MusicXML</small></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="fileImportDialog" class="dialog" aria-labelledby="fileImportTitle">
    <h2 id="fileImportTitle"></h2>
    <input type="file" id="libFileInput" hidden multiple accept=".musicxml,.xml,.mxl,.mid,.midi" />
    <input type="file" id="backupFileInput" hidden accept=".json,application/json" />
    <form method="dialog" class="dialog-actions">
      <button class="btn ghost" data-i18n="close">閉じる</button>
    </form>
